name: Build OpenClaw with GUI Agent Patches

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: main
          fetch-depth: 1

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 赋予 Gradle 执行权限
        run: chmod +x apps/android/gradlew

      - name: 编译 Third Party Debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleThirdPartyDebug --no-daemon 2>&1 | tail -30

      - name: 查找 APK
        run: find apps/android -name "*.apk" 2>/dev/null

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-gui-agent-apk
          path: apps/android/app/build/outputs/apk/thirdParty/debug/*.apk
          if-no-files-found: error
          retention-days: 7
