# OpenClaw Android APK 编译工作流
# 使用方法：
# 1. Fork https://github.com/openclaw/openclaw
# 2. 把这个文件放到 .github/workflows/build-openclaw-android.yml
# 3. Push 到你的 GitHub 仓库
# 4. 在 GitHub 仓库页面点 Actions → 选这个 workflow → Run workflow

name: Build OpenClaw Android APK (Latest)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-openclaw-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout OpenClaw 源码
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: main
          fetch-depth: 1

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 赋予 Gradle 执行权限
        run: chmod +x apps/android/gradlew

      - name: 编译 Debug APK（Third Party 版本）
        working-directory: apps/android
        run: ./gradlew :app:assembleThirdPartyDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-thirdparty-debug-apk
          path: apps/android/app/build/outputs/apk/thirdParty/debug/*.apk
          if-no-files-found: error
          retention-days: 7
