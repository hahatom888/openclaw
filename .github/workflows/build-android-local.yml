name: Build OpenClaw Android APK (Local)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout local source
        uses: actions/checkout@v4
        with:
          repository: hahatom888/openclaw
          ref: main
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle permission
        run: chmod +x apps/android/gradlew

      - name: Build Third Party Debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleThirdPartyDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-thirdparty-debug-apk
          path: apps/android/app/build/outputs/apk/thirdParty/debug/*.apk
          if-no-files-found: error
